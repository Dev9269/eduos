[server]
host = 0.0.0.0
port = 8000
debug = false
ssl_cert = /etc/edos/cert.pem
ssl_key = /etc/edos/key.pem

[database]
db_path = /var/lib/edos/server.db
host = localhost
port = 5432
name = edos
user = edos
password = CHANGE_ME

[exam]
default_duration = 60
max_questions = 100
lockdown_enabled = true
auto_submit = true

[sync]
interval = 60
max_retries = 3
timeout = 30
