<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="dialogBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#0f0f1e;stop-opacity:0.98"/>
    </linearGradient>
    <filter id="dialogShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="32" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="dialogBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c63ff;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#4fc3f7;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="392" height="292" rx="18" ry="18" fill="url(#dialogBg)" filter="url(#dialogShadow)"/>
  <rect x="4" y="4" width="392" height="292" rx="18" ry="18" fill="none" stroke="url(#dialogBorder)" stroke-width="1"/>
</svg>