<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="56" viewBox="0 0 100 56">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a14;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#0f0f1e;stop-opacity:0.9"/>
    </linearGradient>
    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur"/>
      <feBlend in="SourceGraphic" in2="blur" mode="normal"/>
    </filter>
    <filter id="bottomShadow" x="-50%" y="0%" width="200%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="20" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="100" height="56" rx="0" ry="0" fill="url(#panelBg)" filter="url(#glassBlur)"/>
  <rect x="0" y="52" width="100" height="4" fill="url(#panelBg)" filter="url(#bottomShadow)"/>
  <line x1="0" y1="56" x2="100" y2="56" stroke="rgba(108,99,255,0.15)" stroke-width="1"/>
</svg>