name: Build EduOS FreeBSD ISO

on:
  workflow_dispatch:

jobs:
  build-freebsd-iso:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install FreeBSD build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-utils qemu-system-x86 \
            xorriso squashfs-tools e2fsprogs \
            curl wget python3 python3-pip

      - name: Download FreeBSD 14.2 base
        run: |
          # FreeBSD 14.2-RELEASE is the current stable (2024-2025)
          FREEBSD_VERSION="14.2-RELEASE"
          FREEBSD_ARCH="amd64"
          BASE_URL="https://download.freebsd.org/releases/${FREEBSD_ARCH}/${FREEBSD_VERSION}"

          mkdir -p freebsd-base
          # Download minimal base set
          curl -L "${BASE_URL}/base.txz" -o freebsd-base/base.txz
          curl -L "${BASE_URL}/kernel.txz" -o freebsd-base/kernel.txz
          curl -L "${BASE_URL}/lib32.txz" -o freebsd-base/lib32.txz

      - name: Extract FreeBSD base
        run: |
          mkdir -p rootfs
          sudo tar -xf freebsd-base/base.txz -C rootfs/
          sudo tar -xf freebsd-base/kernel.txz -C rootfs/
          echo "FreeBSD base extracted"
          ls rootfs/

      - name: Configure FreeBSD for EduOS
        run: |
          sudo mkdir -p rootfs/opt/eduos rootfs/etc/eduos

          sudo cp -r AdminCenter CyberLab DevSuite ExamMode \
            LearnHub Scripts Branding Themes \
            Server Services rootfs/opt/eduos/ 2>/dev/null || true

          # Use Python to write config files - avoids heredoc indent issues
          sudo python3 - << 'PYEOF'
          import pathlib, textwrap

          rc_conf = textwrap.dedent("""
              hostname="eduos"
              ifconfig_DEFAULT="DHCP"
              sshd_enable="NO"
              moused_enable="YES"
              dbus_enable="YES"
              hald_enable="YES"
              dumpdev="AUTO"
              zfs_enable="NO"
              eduos_firstboot_enable="YES"
              eduos_agent_enable="YES"
          """).lstrip()

          rc = pathlib.Path("rootfs/etc/rc.conf")
          rc.write_text(rc_conf)

          users = pathlib.Path("rootfs/etc/eduos-users.conf")
          users.parent.mkdir(parents=True, exist_ok=True)
          users.write_text("student_shell=/bin/sh\nstudent_home=/home/student\n")

          agent = pathlib.Path("rootfs/etc/eduos/agent.conf")
          agent.parent.mkdir(parents=True, exist_ok=True)
          agent.write_text('{\n  "server_url": "ws://eduos-server.local:8765",\n  "token": ""\n}\n')

          print("Config files written OK")
          PYEOF

          # Set timezone
          sudo cp rootfs/usr/share/zoneinfo/Asia/Kolkata \
            rootfs/etc/localtime 2>/dev/null || true

      - name: Configure FreeBSD bootloader
        run: |
          sudo mkdir -p rootfs/boot

          sudo python3 - << 'PYEOF'
          import pathlib, textwrap

          lc_conf = textwrap.dedent("""
              geom_label_load="YES"
              zfs_load="NO"
              kern.vty=vt
              autoboot_delay="3"
              beastie_disable="YES"
              loader_logo="none"
          """).lstrip()

          lc = pathlib.Path("rootfs/boot/loader.conf")
          lc.write_text(lc_conf)

          fstab_conf = textwrap.dedent("""
              # EduOS FreeBSD fstab
              /dev/ada0s1a\t/\tufs\trw\t1\t1
              /dev/ada0s1b\tnone\tswap\tsw\t0\t0
              tmpfs\t/tmp\ttmpfs\trw,mode=1777\t0\t0
          """).lstrip()

          fstab = pathlib.Path("rootfs/etc/fstab")
          fstab.write_text(fstab_conf)

          print("Bootloader config written OK")
          PYEOF

      - name: Stage first-boot package installer
        run: |
          sudo mkdir -p rootfs/etc/rc.d

          sudo python3 - << 'PYEOF'
          import pathlib, stat, textwrap

          firstboot_script = textwrap.dedent("""
              #!/bin/sh
              # PROVIDE: eduos_firstboot
              # REQUIRE: NETWORKING
              # BEFORE: LOGIN
              # KEYWORD: firstboot

              . /etc/rc.subr
              name="eduos_firstboot"
              start_cmd="eduos_firstboot_run"

              eduos_firstboot_run()
              {
                echo "[EduOS] First-boot setup starting..."
                env ASSUME_ALWAYS_YES=YES pkg update -q || true
                pkg install -y python311 py311-pip git curl wget bash nano || true
                pip3.11 install --quiet cryptography fastapi uvicorn pyjwt websockets psutil || true
                if [ -f /opt/eduos/Services/freebsd/eduos_agent ]; then
                  cp /opt/eduos/Services/freebsd/eduos_agent /usr/local/etc/rc.d/eduos_agent
                  chmod +x /usr/local/etc/rc.d/eduos_agent
                  sysrc eduos_agent_enable="YES"
                  service eduos_agent start || true
                fi
                sysrc eduos_firstboot_enable="NO"
                rm -f /etc/rc.d/eduos_firstboot
                echo "[EduOS] First-boot complete."
              }

              load_rc_config $name
              : ${eduos_firstboot_enable:=YES}
              run_rc_command "$1"
          """).lstrip()

          script = pathlib.Path("rootfs/etc/rc.d/eduos_firstboot")
          script.write_text(firstboot_script)
          script.chmod(script.stat().st_mode | stat.S_IEXEC | stat.S_IXGRP | stat.S_IXOTH)
          print("First-boot script written OK")
          PYEOF

      - name: Create student user
        run: |
          sudo python3 - << 'PYEOF'
          import pathlib, stat, textwrap

          adduser_script = textwrap.dedent("""
              #!/bin/sh
              # PROVIDE: eduos_adduser
              # REQUIRE: NETWORKING eduos_firstboot
              # BEFORE: LOGIN
              # KEYWORD: firstboot

              . /etc/rc.subr
              name="eduos_adduser"
              start_cmd="eduos_adduser_run"

              eduos_adduser_run()
              {
                if ! id student >/dev/null 2>&1; then
                  pw useradd student -m -s /bin/sh -c "EduOS Student"
                  echo "eduos2025" | pw usermod student -h 0
                  echo "[EduOS] Student user created"
                fi
                sysrc eduos_adduser_enable="NO"
                rm -f /etc/rc.d/eduos_adduser
              }

              load_rc_config $name
              : ${eduos_adduser_enable:=YES}
              run_rc_command "$1"
          """).lstrip()

          adduser = pathlib.Path("rootfs/etc/rc.d/eduos_adduser")
          adduser.parent.mkdir(parents=True, exist_ok=True)
          adduser.write_text(adduser_script)
          adduser.chmod(adduser.stat().st_mode | stat.S_IEXEC | stat.S_IXGRP | stat.S_IXOTH)

          rc = pathlib.Path("rootfs/etc/rc.conf")
          if rc.exists():
              current = rc.read_text()
              if "eduos_adduser" not in current:
                  rc.write_text(current + 'eduos_adduser_enable="YES"\n')
          else:
              rc.write_text('eduos_adduser_enable="YES"\n')

          print("Student user script written OK — first line:", adduser_script.split("\n")[0])
          PYEOF

      - name: Build bootable FreeBSD ISO
        run: |
          mkdir -p isoroot/boot/kernel
          mkdir -p isoroot/etc
          mkdir -p isoroot/opt/eduos

          # Copy FreeBSD kernel files
          sudo cp -r rootfs/boot/kernel/ isoroot/boot/ 2>/dev/null || true
          sudo cp rootfs/boot/loader.efi isoroot/boot/ 2>/dev/null || true
          sudo cp rootfs/boot/loader isoroot/boot/ 2>/dev/null || true
          sudo cp rootfs/boot/boot isoroot/boot/ 2>/dev/null || true

          # Copy EduOS app files directly into ISO
          sudo cp -r rootfs/opt/eduos/ isoroot/opt/ 2>/dev/null || true
          sudo cp -r rootfs/etc/eduos isoroot/etc/ 2>/dev/null || true
          sudo cp rootfs/etc/rc.conf isoroot/etc/ 2>/dev/null || true
          sudo cp -r rootfs/etc/rc.d/ isoroot/etc/ 2>/dev/null || true

          # FreeBSD loader config (Python write — no heredoc indent issues)
          sudo python3 - << 'PYEOF'
          import pathlib, textwrap

          iso_lc_conf = textwrap.dedent("""
              geom_label_load="YES"
              kern.geom.label.disk_ident.enable="0"
              kern.geom.label.gptid.enable="0"
              zfs_load="NO"
          """).lstrip()

          lc = pathlib.Path("isoroot/boot/loader.conf")
          lc.write_text(iso_lc_conf)
          print("ISO loader.conf written OK")
          PYEOF

          # Create the ISO using makefs + mkisofs approach
          sudo xorriso \
            -as mkisofs \
            -o eduos-freebsd.iso \
            -V "EduOS-FreeBSD-14" \
            -J -r \
            --no-emul-boot \
            isoroot/ 2>/dev/null || \
          sudo xorriso \
            -as mkisofs \
            -o eduos-freebsd.iso \
            -V "EduOS-FreeBSD-14" \
            -J -r \
            isoroot/
          echo "ISO created: $(ls -lh eduos-freebsd.iso)"

      - name: Upload FreeBSD ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: eduos-freebsd-iso
          path: eduos-freebsd.iso
          retention-days: 30
