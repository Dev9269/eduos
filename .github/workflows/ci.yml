name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pyflakes pylint
          pip install -r requirements.txt --ignore-requires-python \
            || true
      - name: Lint Python files
        run: |
          find . -name "*.py" -not -path "./.git/*" | \
            xargs pyflakes 2>&1 || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pytest
          pip install -r requirements.txt --ignore-requires-python \
            || true
      - name: Run tests
        run: |
          if [ -d "tests/" ]; then
            pytest tests/ -v
          else
            echo "No tests directory found — skipping"
            exit 0
          fi

  validate-freebsd-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate FreeBSD ISO workflow YAML
        run: |
          pip install pyyaml --quiet
          python3 -c "
          import yaml, sys
          try:
              yaml.safe_load(open('.github/workflows/build-freebsd-iso.yml'))
              print('FreeBSD ISO workflow YAML: VALID')
          except yaml.YAMLError as e:
              print(f'INVALID YAML: {e}')
              sys.exit(1)
          "

      - name: Check for heredoc indentation bug
        run: |
          pip install pyyaml --quiet
          python3 - << 'PYEOF'
          import re, sys, yaml, pathlib, tempfile, os, subprocess, json

          data = yaml.safe_load(open('.github/workflows/build-freebsd-iso.yml'))
          scripts = [
              step['run'] for step in data['jobs']['build-freebsd-iso']['steps']
              if 'run' in step
          ]

          # Extract the python heredoc blocks and run them in a temp dir,
          # then verify the generated config files have no leading spaces.
          tmp = pathlib.Path(tempfile.mkdtemp())
          os.chdir(tmp)
          for d in ['rootfs/etc/rc.d', 'rootfs/boot', 'rootfs/etc/eduos',
                    'isoroot/boot']:
              (tmp / d).mkdir(parents=True, exist_ok=True)

          for script in scripts:
              for m in re.finditer(r"python3 - << ['\"]?(\w+)['\"]?\n(.*?)\n\1\n", script, re.S):
                  code = m.group(2)
                  r = subprocess.run(
                      [sys.executable, '-c', code],
                      capture_output=True, text=True
                  )
                  if r.returncode != 0:
                      print(f'Python block failed: {r.stderr[:200]}')
                      sys.exit(1)

          # Config files must have zero leading-space lines.
          # JSON files (agent.conf) are exempt — indentation is valid JSON.
          config_files = [
              'rootfs/etc/rc.conf', 'rootfs/boot/loader.conf',
              'rootfs/etc/fstab', 'rootfs/etc/eduos-users.conf',
              'isoroot/boot/loader.conf',
          ]
          json_files = ['rootfs/etc/eduos/agent.conf']
          bad = []
          for f in config_files:
              p = tmp / f
              if not p.exists():
                  bad.append(f + ' (missing)')
                  continue
              for l in p.read_text().splitlines():
                  if l != l.lstrip() and l.strip():
                      bad.append(f'{f}: {l[:40]!r}')
          for f in json_files:
              p = tmp / f
              if not p.exists():
                  bad.append(f + ' (missing)')
                  continue
              try:
                  json.loads(p.read_text())
              except Exception as e:
                  bad.append(f'{f}: invalid JSON ({e})')
          if bad:
              print('HEREDOC BUG: config files have leading spaces:')
              for b in bad[:5]:
                  print('  ' + b)
              sys.exit(1)

          # rc.d scripts must be valid shell
          for f in ['rootfs/etc/rc.d/eduos_firstboot', 'rootfs/etc/rc.d/eduos_adduser']:
              r = subprocess.run(
                  ['sh', '-n', str(tmp / f)],
                  capture_output=True, text=True
              )
              if r.returncode != 0:
                  print(f'Invalid shell script {f}: {r.stderr[:200]}')
                  sys.exit(1)

          print('Heredoc check passed - generated config files are clean')
          PYEOF

      - name: Validate FreeBSD package names format
        run: |
          python3 -c "
          lines = [l.strip() for l in open('Packages/freebsd-packages.txt')
                   if l.strip() and not l.startswith('#')]
          # FreeBSD pkg names should not contain dashes in category
          print(f'Package list: {len(lines)} entries — OK')
          "

  validate-freebsd-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate FreeBSD package list format
        run: |
          python3 - << 'PYEOF'
          import sys

          with open("Packages/freebsd-packages.txt") as f:
              lines = [l.strip() for l in f if l.strip() and not l.startswith("#")]

          print(f"Package list: {len(lines)} entries")

          # Check for known-bad names (Debian names that don't exist in FreeBSD pkg)
          debian_names = ["apt", "dpkg", "libc6", "libssl-dev", "build-essential",
                          "python3-pip", "python3-pyqt5", "python-is-python3"]
          bad = [l for l in lines if any(d in l for d in debian_names)]
          if bad:
              print(f"ERROR: Found Debian package names in FreeBSD list: {bad}")
              sys.exit(1)

          # Check for empty lines in wrong places
          print("Package list validation passed")
          PYEOF

      - name: Check for systemd in FreeBSD service files
        run: |
          python3 - << 'PYEOF'
          import os, sys

          freebsd_services = []
          for root, dirs, files in os.walk("Services/freebsd"):
              for f in files:
                  freebsd_services.append(os.path.join(root, f))

          for fpath in freebsd_services:
              content = open(fpath).read()
              if "systemctl" in content or "[Unit]" in content:
                  print(f"ERROR: systemd syntax found in FreeBSD file: {fpath}")
                  sys.exit(1)

          print(f"FreeBSD service files checked: {len(freebsd_services)} - OK")
          PYEOF
