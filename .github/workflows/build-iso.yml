name: Build EduOS ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build ISO in Debian container
        run: |
          docker run --privileged --rm -v $PWD:/build -w /build debian:trixie-slim bash -c "
            apt-get update && apt-get install -y -qq live-build debootstrap
            export EDUOS_REPO=/build
            cd /build
            bash Packages/live-build/build-eduos-iso.sh
          "
        timeout-minutes: 120
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: eduos-iso
          path: Packages/live-build/output/*.iso
          retention-days: 30
