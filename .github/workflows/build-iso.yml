name: Build EduOS ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq live-build debootstrap wget ca-certificates debian-archive-keyring
      - name: Build ISO
        run: |
          export EDUOS_REPO="$GITHUB_WORKSPACE"
          cd "$EDUOS_REPO"
          sudo bash Packages/live-build/build-eduos-iso.sh
        timeout-minutes: 120
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: eduos-iso
          path: Packages/live-build/output/*.iso
          retention-days: 30
